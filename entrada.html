<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tu entrada | SOTIRIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e0c15; --surface: #1a1726; --line: #2e2940; --text: #f5f2fb; --muted: #a6a0b8; --coral: #ff4f6d; --gold: #ffb547; --ok: #34d399; --bad: #ff6b6b; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 16px/1.5 "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .t { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 26px; overflow: hidden; }
  .t-top { padding: 26px 24px 20px; background: linear-gradient(135deg, rgba(255, 79, 109, .25), rgba(139, 108, 255, .2)); }
  small { color: var(--gold); font-weight: 700; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; }
  h1 { font: 800 1.8rem/1.1 "Bricolage Grotesque", sans-serif; margin: 6px 0; }
  .muted { color: var(--muted); }
  .qr { background: #fff; margin: 22px auto 10px; width: 230px; height: 230px; border-radius: 16px; padding: 8px; }
  .qr img { width: 100%; height: 100%; image-rendering: pixelated; }
  .code { text-align: center; font: 700 1.3rem ui-monospace, monospace; letter-spacing: .06em; }
  dl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 20px 24px; border-top: 2px dashed var(--line); margin-top: 18px; }
  dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  dd { font-weight: 700; }
  .full { grid-column: span 2; }
  .state { margin: 0 24px 22px; padding: 12px 14px; border-radius: 14px; font-weight: 700; text-align: center; }
  .ok { background: rgba(52, 211, 153, .14); color: var(--ok); }
  .warn { background: rgba(255, 181, 71, .14); color: var(--gold); }
  .bad { background: rgba(255, 107, 107, .12); color: var(--bad); }
  .staff { border-top: 1px solid var(--line); padding: 18px 24px 24px; display: none; }
  .staff.on { display: block; }
  .staff h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; gap: 10px; }
  select, button { font: inherit; border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); background: #0e0c15; color: var(--text); }
  button { flex: 1; border: 0; font-weight: 800; cursor: pointer; background: linear-gradient(120deg, #ff4f6d, #ffb547); color: #1a0a10; }
  button:disabled { opacity: .5; }
  .msg { margin-top: 10px; font-weight: 700; text-align: center; }
  .print { display: block; margin: 0 24px 22px; text-align: center; color: var(--muted); }
  @media print { body { background: #fff; color: #000; } .t { border: 2px solid #000; } .staff, .print { display: none !important; } .t-top { background: none; } }
</style>
</head>
<body>
<main class="t" id="t"><div class="t-top"><p class="muted">Cargando entrada…</p></div></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z0-9-]/g, "");

async function load() {
  const r = await fetch("/api/tickets/" + encodeURIComponent(code)).catch(() => null);
  const t = r && r.ok ? await r.json() : null;
  if (!t) {
    $("#t").innerHTML = `<div class="t-top"><small>SOTIRIA</small><h1>Entrada no válida</h1><p class="muted">El código ${esc(code) || "(vacío)"} no corresponde a ninguna compra confirmada.</p></div><p class="state bad">✕ NO VÁLIDA</p>`;
    return;
  }
  const f = t.funcion;
  const when = f ? new Date(`${f.d}T${f.h}`).toLocaleDateString("es-BO", { weekday: "long", day: "numeric", month: "long" }) + " · " + f.h : "";
  const show = t.product.type === "show";
  const left = t.qty - t.checkedIn;
  const state = !show ? `<p class="state ok">✓ Compra confirmada</p>` : left <= 0 ? `<p class="state bad">✕ Ya ingresaron las ${t.qty} personas</p>` : t.checkedIn ? `<p class="state warn">Ingresaron ${t.checkedIn} de ${t.qty} · quedan ${left}</p>` : `<p class="state ok">✓ Entrada válida para ${t.qty} ${t.qty === 1 ? "persona" : "personas"}</p>`;
  document.title = `${t.code} | ${t.product.t}`;
  $("#t").innerHTML = `
    <div class="t-top"><small>${show ? "Entrada" : "Comprobante de compra"}</small><h1>${esc(t.product.t)}</h1><p class="muted">${esc(show ? when.charAt(0).toUpperCase() + when.slice(1) : t.delivery)}</p></div>
    <div class="qr"><img src="/api/tickets/${esc(t.code)}/qr.png" alt="Código QR"></div>
    <p class="code">${esc(t.code)}</p>
    <dl>
      <div><dt>${show ? "Personas" : "Cantidad"}</dt><dd>${t.qty}</dd></div>
      <div><dt>A nombre de</dt><dd>${esc(t.name)}</dd></div>
      ${show ? `<div class="full"><dt>Lugar</dt><dd>${esc(t.product.venue)} — ${esc(t.product.addr)}</dd></div>` : ""}
    </dl>
    ${state}
    <a class="print" href="#" onclick="print();return false">Imprimir o guardar en PDF</a>
    <section class="staff" id="staff">
      <h2>Puerta (personal)</h2>
      <div class="row"><select id="n" aria-label="Personas que ingresan">${Array.from({ length: Math.max(left, 0) }, (_, i) => `<option value="${i + 1}">${i + 1} ${i ? "personas" : "persona"}</option>`).join("")}</select><button id="in" ${left <= 0 ? "disabled" : ""}>Registrar ingreso</button></div>
      <p class="msg" id="msg"></p>
    </section>`;
  /* si quien escanea tiene sesión en el panel, puede registrar el ingreso */
  if (show && (await fetch("/api/admin/me").then((r) => r.ok).catch(() => false))) {
    $("#staff").classList.add("on");
    $("#in").onclick = async () => {
      $("#in").disabled = true;
      const r = await fetch(`/api/admin/tickets/${t.code}/checkin`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ n: +$("#n").value, by: localStorage.getItem("st_staff") || "puerta" }) });
      const j = await r.json();
      if (!r.ok) {
        $("#msg").textContent = j.error;
        $("#msg").style.color = "var(--bad)";
        $("#in").disabled = false;
        return;
      }
      load();
    };
  }
}
load();
</script>
</body>
</html>
